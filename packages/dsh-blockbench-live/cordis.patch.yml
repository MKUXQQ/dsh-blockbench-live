# 插入 Host 插件行；config 可被用户 profile 的 cordis.patch.yml 覆盖。
# 留空的路径由 index.js 兜底：appPath 默认 apps/bb-agent-app（包旁或 monorepo 根），
# pluginPath 默认 <appPath>/agent/bb-agent-bridge.js，workspaceRoot 默认 ~/.dsh/blockbench-workspace。
- insert:
    - id: blockbench-live
      name: 'dsh-blockbench-live'
      config:
        workspaceRoot: ''
        project: 'default'
        autoStart: true
        useBundledRuntime: true
        provider: 'deepseek'
        model: 'deepseek-chat'
        executable: ''
        appPath: ''
        pluginPath: ''
        connectTimeoutMs: 30000
        defaultTimeoutMs: 120000
        maxImagesPerCall: 4
        imageMaxDimension: 512
        exposeGuiTools: false
        bridgeTransport: auto
